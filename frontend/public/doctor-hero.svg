<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b82ff"/>
      <stop offset="100%" stop-color="#1e44d6"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f5ff"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9c8a1"/>
      <stop offset="100%" stop-color="#e8a982"/>
    </linearGradient>
  </defs>

  <!-- Tinted backdrop shape (rounded arch) -->
  <path d="M210 0 C320 0 400 80 400 200 V480 C400 503 380 520 360 520 H60 C40 520 20 503 20 480 V200 C20 80 100 0 210 0 Z" fill="url(#bg)"/>

  <!-- Soft inner glow -->
  <ellipse cx="210" cy="260" rx="170" ry="200" fill="#ffffff" opacity="0.06"/>

  <!-- Coat body -->
  <path d="M70 520 C70 410 120 360 180 350 L180 320 C180 308 192 300 210 300 C228 300 240 308 240 320 L240 350 C300 360 350 410 350 520 Z" fill="url(#coat)"/>

  <!-- Coat lapels -->
  <path d="M180 350 L210 420 L180 460 Z" fill="#e3edff"/>
  <path d="M240 350 L210 420 L240 460 Z" fill="#e3edff"/>

  <!-- Neck -->
  <rect x="195" y="278" width="30" height="36" rx="6" fill="url(#skin)"/>

  <!-- Head -->
  <ellipse cx="210" cy="230" rx="62" ry="72" fill="url(#skin)"/>

  <!-- Hair -->
  <path d="M150 215 C150 165 175 140 210 140 C245 140 270 165 270 215 C260 195 240 185 210 185 C180 185 160 195 150 215 Z" fill="#2a2a2a"/>

  <!-- Eyes -->
  <ellipse cx="190" cy="232" rx="4" ry="5" fill="#1f2937"/>
  <ellipse cx="230" cy="232" rx="4" ry="5" fill="#1f2937"/>

  <!-- Smile -->
  <path d="M192 258 Q210 270 228 258" stroke="#7c4a2a" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Stethoscope -->
  <path d="M186 360 C170 380 170 410 186 430"
        stroke="#0f1b3d" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M234 360 C250 380 250 410 234 430"
        stroke="#0f1b3d" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="210" cy="448" r="14" fill="#2d5bff" stroke="#0f1b3d" stroke-width="3"/>
  <circle cx="210" cy="448" r="6" fill="#0f1b3d"/>

  <!-- ID badge -->
  <rect x="262" y="395" width="38" height="50" rx="4" fill="#ffffff" stroke="#cadcff" stroke-width="1.5"/>
  <rect x="270" y="403" width="22" height="22" rx="2" fill="#e3edff"/>
  <rect x="270" y="430" width="22" height="3" rx="1.5" fill="#cadcff"/>
  <rect x="270" y="437" width="14" height="3" rx="1.5" fill="#cadcff"/>
</svg>
